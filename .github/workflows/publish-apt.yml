name: publish-apt

on:
  push:
    branches: [main]
    paths:
      - 'pool/**'
      - 'conf/**'
      - 'keys/**'
      - 'extras/**'
      - '.github/workflows/publish-apt.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to push gh-pages branch

concurrency:
  group: publish-apt
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install reprepro and gnupg
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y reprepro gnupg

      - name: Import signing subkey and prime gpg-agent
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
          RINGQ_SIGNING_KEY_ID: ${{ secrets.RINGQ_SIGNING_KEY_ID }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          cat > ~/.gnupg/gpg.conf <<'EOF'
          pinentry-mode loopback
          batch
          EOF
          cat > ~/.gnupg/gpg-agent.conf <<'EOF'
          allow-loopback-pinentry
          default-cache-ttl 7200
          max-cache-ttl 7200
          EOF
          gpgconf --kill all || true
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys
          # Mark the key ultimately trusted so reprepro doesn't refuse to sign with it
          echo "$RINGQ_SIGNING_KEY_ID:6:" | gpg --import-ownertrust
          # Prime gpg-agent: do a one-off sign so the passphrase is cached for the
          # rest of the job. reprepro and later steps then sign without prompting.
          echo "prime" | gpg --batch --pinentry-mode loopback \
              --passphrase "$APT_SIGNING_KEY_PASSPHRASE" \
              --local-user "$RINGQ_SIGNING_KEY_ID" \
              --sign --output /dev/null
          echo "✓ gpg-agent primed"

      - name: Migrate any legacy _incoming/ debs to pool/main/f/freeswitch/
        run: |
          # One-time / idempotent migration from the early staging layout.
          # Going forward, drop .debs directly into pool/main/f/freeswitch/.
          mkdir -p pool/main/f/freeswitch
          if ls pool/main/_incoming/*.deb >/dev/null 2>&1; then
            echo "Migrating $(ls -1 pool/main/_incoming/*.deb | wc -l) .deb(s) from _incoming/ to f/freeswitch/"
            mv pool/main/_incoming/*.deb pool/main/f/freeswitch/
          fi
          rm -rf pool/main/_incoming pool/main/_archived 2>/dev/null || true

      - name: Count .debs to publish
        id: stage
        run: |
          count=$(ls -1 pool/main/f/freeswitch/*.deb 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No .debs found in pool/main/f/freeswitch/. Nothing to publish."
          else
            echo "$count .deb(s) will be included in the apt repo."
          fi

      - name: Build apt repo with reprepro (idempotent rebuild)
        if: steps.stage.outputs.count != '0'
        env:
          RINGQ_SIGNING_KEY_ID: ${{ secrets.RINGQ_SIGNING_KEY_ID }}
        run: |
          # Wipe dists/ and the reprepro state DB so every run rebuilds from
          # scratch off whatever's currently in pool/main/f/freeswitch/.
          # Idempotent — re-running on the same input is a no-op output-wise.
          rm -rf dists db
          for deb in pool/main/f/freeswitch/*.deb; do
            reprepro --basedir . includedeb bookworm "$deb"
          done
          echo "✓ rebuilt dists/bookworm from $(ls -1 pool/main/f/freeswitch/*.deb | wc -l) .deb(s)"

      - name: Verify Release is signed
        if: steps.stage.outputs.count != '0'
        run: |
          test -f dists/bookworm/InRelease
          test -f dists/bookworm/Release.gpg
          gpg --verify dists/bookworm/InRelease
          echo "✓ InRelease signature verifies"

      - name: Bundle vendored FusionPBX installer
        run: |
          # Tar the vendored FusionPBX installer (Debian-only) and drop it in
          # extras/. The installer scripts curl this tarball and extract it
          # directly into /usr/src/fusionpbx-install.sh/, so the tarball's top
          # level must be debian/ (not fusionpbx-install/debian/) — use -C to
          # strip the wrapping dir at tar time.
          if [ -d fusionpbx-install/debian ]; then
            mkdir -p extras
            tar -czf extras/fusionpbx-install-debian.tar.gz -C fusionpbx-install debian
            echo "Tarball top-level entries:"
            tar -tzf extras/fusionpbx-install-debian.tar.gz | head -3
            ls -lh extras/fusionpbx-install-debian.tar.gz
          else
            echo "::warning::fusionpbx-install/debian not found — tarball not built"
          fi

      - name: Smoke test against bookworm container
        run: |
          # Run a quick apt-get update inside a docker container pointing at the
          # repo files on disk. Catches Packages.gz / metadata errors before publish.
          docker run --rm -v "$PWD":/repo debian:bookworm-slim bash -c '
            set -e
            apt-get update >/dev/null 2>&1
            apt-get install -y ca-certificates >/dev/null
            cp /repo/keys/ringq-services-archive-keyring.gpg /usr/share/keyrings/
            echo "deb [signed-by=/usr/share/keyrings/ringq-services-archive-keyring.gpg] file:///repo bookworm main" \
              > /etc/apt/sources.list.d/ringq.list
            apt-get update
            apt-cache madison freeswitch | head -5
          '

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          exclude_assets: '.github,conf,db,tools,fusionpbx-install'
          force_orphan: false
          enable_jekyll: false
          commit_message: "publish: ${{ github.sha }}"

      - name: Live smoke test (post-publish)
        continue-on-error: true
        run: |
          # On first run, gh-pages branch was just created and Pages may not be
          # enabled yet — expect a 404. On subsequent runs, expect success.
          # Either way, don't fail the workflow; the gh-pages push above is the
          # real success signal.
          sleep 30
          if curl -fsSL https://ringq-devs.github.io/services/dists/bookworm/InRelease >/tmp/InRelease 2>/dev/null; then
            gpg --verify /tmp/InRelease && echo "✓ live InRelease verifies"
          else
            echo "::warning::Live URL not yet reachable (HTTP $(curl -s -o /dev/null -w '%{http_code}' https://ringq-devs.github.io/services/dists/bookworm/InRelease))."
            echo "::warning::If this is the first run, enable Pages: Settings → Pages → Branch: gh-pages / Folder: /(root)."
            echo "::warning::The gh-pages branch HAS been updated successfully — that is the source of truth."
          fi
